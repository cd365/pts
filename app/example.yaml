# Database configuration
database:
    driver: postgres
    username: postgres
    password: postgres
    host: localhost
    port: 5432
    database: db_name
    data_source_name: ""
    database_schema_name: public
    table_prefix: pre_

# Table filter regular expression or actual table name.
disable_table:
    - ^disable_.*$
    - ^example_.*$
    - system_table_name

# Custom override comment.
comments:
    example_test:
        comment: example test table comment
        columns:
            id: ID primary key
    example_user:
        comment: example user
        columns:
            age: Age
            created_at: created timestamp
            deleted_at: deleted timestamp
            email: Email
            id: ID primary key
            name: Name
            updated_at: updated timestamp

sign: 01
model_package: model

# Custom template configuration.
template_file_custom: replace this with a `custom` template path
template_file_replace: replace this with a `replace` template path
template_file_schema: replace this with a `schema` template path
template_file_model: replace this with a `model` template path
template_table:
    - template_file:
      output_file_directory:
      output_file_name_suffix: _admin
      output_go_file_package_name: schema

# Schema output configuration.
output_schema_methods: true
output_schema_table_column_methods:
    employee:
        select:
            - email
            - username